[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "screen-ocr"
version = "0.1.0"
description = "Offline Windows screen-region OCR utility"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "PySide6==6.10.1",
  "paddleocr==3.7.0",
  "paddlepaddle==3.3.1",
  "numpy>=2.1,<3",
  "opencv-python-headless>=4.10,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "pyinstaller==6.21.0",
]

[project.scripts]
screen-ocr = "screen_ocr.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

